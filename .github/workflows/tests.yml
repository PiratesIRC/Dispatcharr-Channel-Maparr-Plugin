name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Every shipped module, found by pattern rather than listed by hand. The
      # previous hand-maintained list had never included group_scope.py or
      # wildcard_match.py, so those two shipped without ever being compile
      # checked. A list that must be edited whenever a module is added is a list
      # that will be forgotten.
      - name: Compile-check shipped plugin sources
        run: |
          shopt -s nullglob
          files=(Channel-Maparr/*.py)
          if [ ${#files[@]} -eq 0 ]; then echo "no plugin sources found"; exit 1; fi
          printf 'compiling %s\n' "${files[@]}"
          python -m py_compile "${files[@]}"
        shell: bash

      # Explicit, named drift gate: freezes the pure matcher primitives against
      # tests/matcher_golden_baseline.json (Stage 0 of the matcher standardization
      # plan). -o addopts="" neutralizes any inherited ini options for a clean run.
      - name: Matcher golden drift gate
        run: python -m pytest tests/test_matcher_golden.py -q -o addopts=""

      # The vendored shared matching core must stay byte-identical to its pinned hash
      # (catches a stray hand-edit to the vendored copy or a CRLF checkout).
      - name: Vendored-core parity gate
        run: python -m pytest tests/test_core_parity.py -q -o addopts=""

      # The emailed HTML report carries a small script that sorts its table.
      # tests/test_report_sorting.py runs that script for real and skips itself
      # when Node is absent, so without this step the shipped JavaScript is only
      # ever executed on a developer machine.
      - name: Set up Node, so the report sorting tests actually run
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run test suite
        run: python -m pytest

      # Advisory only, and deliberately not a gate yet: the repository has a
      # backlog of pre-existing findings, so failing the build on them would
      # make this workflow permanently red and teach everyone to ignore it.
      # Annotations still appear on the pull request. Turn continue-on-error off
      # once the backlog is cleared.
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check --output-format=github . || true
